services:
  icecast:
    build: ./icecast
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/"]
      interval: 5s
      timeout: 3s
      retries: 12

  nginx-rtmp:
    build: ./nginx-rtmp
    ports:
      - "8088:80"
      - "1935:1935"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

  audio-source:
    image: ubuntu:26.04
    depends_on:
      icecast:
        condition: service_healthy
    command: >-
      bash -lc "apt-get update -qq && apt-get install -y -qq ffmpeg ca-certificates >/dev/null
      && ffmpeg -hide_banner -loglevel warning -re -f lavfi -i sine=frequency=1000:sample_rate=44100
      -c:a libmp3lame -b:a 128k -t 3600 -f mp3
      icecast://source:sourcepass@icecast:8000/radio.mp3"

  video-source:
    image: ubuntu:26.04
    depends_on:
      nginx-rtmp:
        condition: service_healthy
    command: >-
      bash -lc "apt-get update -qq && apt-get install -y -qq ffmpeg ca-certificates >/dev/null
      && ffmpeg -hide_banner -loglevel warning -re -f lavfi -i testsrc=size=1280x720:rate=25
      -f lavfi -i sine=frequency=440:sample_rate=44100 -t 3600
      -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p
      -c:a aac -b:a 128k -f flv rtmp://nginx-rtmp/live/ut8"

  client:
    image: ubuntu:26.04
    depends_on:
      icecast:
        condition: service_healthy
      nginx-rtmp:
        condition: service_healthy
    command: >-
      bash -lc "apt-get update -qq && apt-get install -y -qq curl ffmpeg >/dev/null
      && sleep infinity"
