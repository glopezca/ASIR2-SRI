services:
  kea-config:
    build: .
    command: ["kea-dhcp4", "-t", "/etc/kea/kea-dhcp4.conf"]
    volumes:
      - ./kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro

  tools:
    image: ubuntu:26.04
    command: >-
      bash -lc "apt-get update -qq && apt-get install -y -qq iproute2 iputils-ping
      netcat-openbsd >/dev/null && sleep infinity"
