{
  "Dhcp4": {
    "interfaces-config": { "interfaces": [ "*" ] },
    "lease-database": {
      "type": "memfile",
      "persist": false,
      "name": "/tmp/dhcp4.leases"
    },
    "valid-lifetime": 3600,
    "subnet4": [
      {
        "subnet": "192.168.50.0/24",
        "pools": [ { "pool": "192.168.50.100 - 192.168.50.150" } ],
        "option-data": [
          { "name": "routers", "data": "192.168.50.1" },
          { "name": "domain-name-servers", "data": "192.168.50.10" },
          { "name": "domain-name", "data": "asirlab.test" }
        ]
      }
    ]
  }
}
